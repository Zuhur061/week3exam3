<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-black text-white font-sans">
  <header class="w-full px-6 lg:px-16 py-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div>
          <img src="./src/imgs/Logo (3).png" alt="">
        </div>
      </div>
      <nav class="hidden lg:flex items-center gap-12 text-gray-300">
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Careers</a>
        <a href="#">Career Details</a>
        <a href="#">Contact</a>
      </nav>
      <button class="bg-blue-600 px-7 py-3 rounded-xl font-semibold">
        Contact Us
      </button>
    </div>
  </header>
  <section class="px-6 lg:px-16 pb-16 pt-6">
    <div
      class="max-w-7xl mx-auto rounded-[40px] overflow-hidden relative bg-cover bg-center"
      style="background-image: url('./src/imgs/image\ 6.png');">
      <div class="relative z-10 grid lg:grid-cols-2 gap-10 items-center px-8 md:px-14 py-14 md:py-20 bg-black/40">
        <div>
          <h2 class="text-4xl md:text-5xl font-bold leading-tight mb-8">
            Web Designer
          </h2>
          <button class="bg-blue-600 px-7 py-3 rounded-xl font-semibold mt-10">
        Apply Now
      </button>
        </div>
    </div>
</section>
<section class="bg-black py-16 px-4">
  <div class="max-w-6xl mx-auto bg-[#0d0d0d] border border-[#1c1c1c] rounded-3xl p-6 md:p-10">
    <h2 class="text-white text-3xl md:text-4xl font-bold mb-10">
      Apply Now
    </h2>
    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input 
          type="text"
          placeholder="First Name*"
          class="w-full h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-5 text-white outline-none">
        <input 
          type="text"
          placeholder="Last Name*"
          class="w-full h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-5 text-white outline-none">
      </div>
      <input 
        type="email"
        placeholder="Email*"
        class="w-full h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-5 text-white outline-none">
      <input 
        type="text"
        placeholder="Headline (Optional)"
        class="w-full h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-5 text-white outline-none">
      <div class="flex flex-col md:flex-row gap-4">
        <div class="w-full md:w-[140px] h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-4 text-white flex items-center">
          +1
        </div>
        <input 
          type="text"
          placeholder="Phone Number"
          class="flex-1 h-[70px] bg-[#181818] border border-[#222222] rounded-xl px-5 text-white outline-none">
      </div>
      <textarea 
        placeholder="Application Submission"
        class="w-full h-[220px] bg-[#181818] border border-[#222222] rounded-xl p-5 text-white outline-none resize-none"
      ></textarea>
      <label class="w-full min-h-[170px] border-2 border-dashed border-[#2b2b2b] rounded-2xl bg-[#181818] flex flex-col items-center justify-center text-center px-4 cursor-pointer">
        <p class="text-gray-400 text-lg">
          Drag & Drop File Here or
        </p>
        <input type="file" class="hidden">
      </label>
      <div class="w-full md:w-[420px] h-[110px] bg-white rounded-md flex items-center px-6">
        <div class="w-8 h-8 border-2 border-gray-400 rounded mr-5"></div>
        <div>
          <p class="text-black text-lg font-medium">
            Verify you are human
          </p>
          <p class="text-gray-500 text-sm mt-1">
            Privacy - Terms
          </p>
        </div>
      </div>
      <button class="w-full h-[75px] bg-blue-600 rounded-2xl text-white text-xl font-medium mt-4">
        Submit Application
      </button>
    </form>
  </div>
</section>
</body>
</html>
